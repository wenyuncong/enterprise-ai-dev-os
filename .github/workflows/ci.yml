name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate adapter registry JSON
        run: node -e "JSON.parse(require('fs').readFileSync('tools/adapters.json','utf8')); console.log('adapters json ok')"

      - name: Audit methodology
        run: python scripts/py/audit_methodology.py --project-root .

      - name: Methodology scenario regression
        run: python scripts/py/test_methodology_scenarios.py --project-root .

      - name: Delivery contract validator regression
        run: python scripts/py/test_delivery_contract_validator.py -v

      - name: Rule lint
        run: python scripts/py/rule_lint.py --project-root .

      - name: Check constitution
        run: python scripts/py/check_constitution.py --project-root .

      - name: Aggregate L0-L3 gates (live)
        run: python scripts/py/aggregate_evidence.py --project-root . --live

      - name: Validate task DAG template
        run: python scripts/py/orchestrate_dag.py --dag "docs/_templates/全项目总控/task_dag.json"

      - name: Report evolution candidates
        run: python scripts/py/evolution_counter.py --project-root . report

      - name: Build repomap
        run: python scripts/py/build_repomap.py --project-root . --json

      - name: Runtime asset regression tests
        run: python scripts/py/test_runtime_assets.py

      - name: Audit governance contract schemas
        run: python scripts/py/audit_governance_contracts.py --project-root .

      - name: Report public document references
        run: python scripts/py/audit_reference_links.py --project-root .

      - name: Check open-source boundary
        run: python scripts/py/check_open_source_boundary.py --project-root .

      - name: Score readiness
        run: python scripts/py/score_ai_development_readiness.py --project-root .

      - name: Deploy smoke tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ps1/test_deploy.ps1

      - name: CLI smoke tests
        run: node --test scripts/js/test_cli.mjs

      - name: Validate website
        run: node -e "const fs=require('fs'); const html=fs.readFileSync('site/index.html','utf8'); if(!html.includes('Enterprise AI Development OS')) process.exit(1); console.log('site ok')"
