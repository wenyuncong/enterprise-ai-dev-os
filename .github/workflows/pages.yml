name: Deploy Site To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "i18n/zh-CN/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Chinese edition site
        run: |
          python i18n/zh-CN/site/build_site.py --source-root .
          mkdir -p site/zh-CN
          cp i18n/zh-CN/site/index.html site/zh-CN/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
